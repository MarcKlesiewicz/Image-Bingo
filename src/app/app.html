<a class="skip-link" href="#main-content">Skip to main content</a>

<header
  class="app-header"
  [class.is-setup-stage]="game.routePhase() === 'setup'"
  [class.is-play-stage]="game.routePhase() === 'play'"
  [class.is-results-stage]="game.routePhase() === 'results'"
>
  <a
    class="brand"
    [routerLink]="game.authoritativeRoute()"
    [attr.aria-label]="headerTitle() + ', current game stage'"
  >
    <fa-icon class="brand-icon" [icon]="faTableCellsLarge" aria-hidden="true" />
    <span>{{ headerTitle() }}</span>
  </a>
</header>

<main
  id="main-content"
  [class.is-setup-stage]="game.routePhase() === 'setup'"
  [class.is-play-stage]="game.routePhase() === 'play'"
  [class.is-results-stage]="game.routePhase() === 'results'"
  tabindex="-1"
>
  <router-outlet />
</main>

<p class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
  {{ shellAnnouncement() }}
</p>
